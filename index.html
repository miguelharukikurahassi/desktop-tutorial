<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bald Hero Adventure | Pixel Platformer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 4px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            image-rendering: pixelated; /* Essential for pixel art */
        }

        .controls-hint {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .controls-hint span {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Bald Hero Adventure</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <div class="controls-hint">
        Use <span>Setas</span> ou <span>WASD</span> para mover | <span>Espaço</span> ou <span>W</span> para pular
    </div>

    <!-- Main Game Scripts -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
